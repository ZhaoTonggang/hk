<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>空洞骑士网页版</title>
		<link rel="icon" type="image/png" href="./icon.png" />
		<link rel="stylesheet" href="./style.css" />
	</head>
	<body>
		<canvas id="unity-canvas">您的浏览器不支持 canvas</canvas>
		<!-- 移动端虚拟按键（仅触屏设备进入游戏后显示） -->
		<div id="touch-controls">
			<div class="tc-joystick" id="tc-joystick">
				<div class="tc-stick" id="tc-stick"></div>
			</div>
			<div class="tc-side">
				<div class="tc-mini-row">
					<button class="tc-btn tc-mini" data-k="map"><b>Tab</b><small>地图</small></button>
					<button class="tc-btn tc-mini" data-k="inventory"><b>I</b><small>物品</small></button>
				</div>
				<div class="tc-mini-row">
					<button class="tc-btn tc-mini" data-k="dreamnail"><b>D</b><small>梦钉</small></button>
					<button class="tc-btn tc-mini" data-k="superdash"><b>S</b><small>超冲</small></button>
					<button class="tc-btn tc-mini" data-k="quickcast"><b>F</b><small>快施</small></button>
				</div>
				<div class="tc-main">
					<button class="tc-btn tc-big" data-k="focus"><b>A</b><small>聚集</small></button>
					<button class="tc-btn tc-big" data-k="dash"><b>C</b><small>冲刺</small></button>
					<button class="tc-btn tc-big" data-k="attack"><b>X</b><small>攻击</small></button>
					<button class="tc-btn tc-big tc-jump" data-k="jump"><b>Z</b><small>跳跃</small></button>
				</div>
			</div>
		</div>
		<button id="btn-confirm">开始游戏</button>
		<!-- 存档管理 -->
		<button id="savemgr">存档管理</button>
		<!-- LOADER -->
		<div id="loader">
			<div id="progress-bar">
				<div id="progress-fill"></div>
			</div>
			<div id="loading-text">Preparing files...</div>
		</div>
		<!-- 存档管理弹窗 -->
		<div id="save-modal">
			<div id="save-modal-box">
				<div id="save-modal-title">存档管理</div>
				<div id="save-modal-tip">管理游戏存档的导出、导入、拷贝与删除</div>
				<div id="save-slots">
					<div class="slot-row" data-slot="1">
						<div class="slot-info"><span class="slot-name">存档 1</span><span class="slot-status">—</span>
						</div>
						<div class="slot-actions">
							<button class="act-btn act-export" data-act="export">导出</button>
							<button class="act-btn act-import" data-act="import">导入</button>
							<button class="act-btn act-copy" data-act="copy">拷贝</button>
							<button class="act-btn act-delete" data-act="delete">删除</button>
						</div>
					</div>
					<div class="slot-row" data-slot="2">
						<div class="slot-info"><span class="slot-name">存档 2</span><span class="slot-status">—</span>
						</div>
						<div class="slot-actions">
							<button class="act-btn act-export" data-act="export">导出</button>
							<button class="act-btn act-import" data-act="import">导入</button>
							<button class="act-btn act-copy" data-act="copy">拷贝</button>
							<button class="act-btn act-delete" data-act="delete">删除</button>
						</div>
					</div>
					<div class="slot-row" data-slot="3">
						<div class="slot-info"><span class="slot-name">存档 3</span><span class="slot-status">—</span>
						</div>
						<div class="slot-actions">
							<button class="act-btn act-export" data-act="export">导出</button>
							<button class="act-btn act-import" data-act="import">导入</button>
							<button class="act-btn act-copy" data-act="copy">拷贝</button>
							<button class="act-btn act-delete" data-act="delete">删除</button>
						</div>
					</div>
					<div class="slot-row" data-slot="4">
						<div class="slot-info"><span class="slot-name">存档 4</span><span class="slot-status">—</span>
						</div>
						<div class="slot-actions">
							<button class="act-btn act-export" data-act="export">导出</button>
							<button class="act-btn act-import" data-act="import">导入</button>
							<button class="act-btn act-copy" data-act="copy">拷贝</button>
							<button class="act-btn act-delete" data-act="delete">删除</button>
						</div>
					</div>
					<div class="slot-divider">备用存档（游戏内不会读取，仅用于数据备份与拷贝）</div>
					<div class="slot-row slot-row-backup" data-slot="5">
						<div class="slot-info"><span class="slot-name">备用 1</span><span class="slot-status">—</span>
						</div>
						<div class="slot-actions">
							<button class="act-btn act-export" data-act="export">导出</button>
							<button class="act-btn act-import" data-act="import">导入</button>
							<button class="act-btn act-copy" data-act="copy">拷贝</button>
							<button class="act-btn act-delete" data-act="delete">删除</button>
						</div>
					</div>
					<div class="slot-row slot-row-backup" data-slot="6">
						<div class="slot-info"><span class="slot-name">备用 2</span><span class="slot-status">—</span>
						</div>
						<div class="slot-actions">
							<button class="act-btn act-export" data-act="export">导出</button>
							<button class="act-btn act-import" data-act="import">导入</button>
							<button class="act-btn act-copy" data-act="copy">拷贝</button>
							<button class="act-btn act-delete" data-act="delete">删除</button>
						</div>
					</div>
				</div>
				<button id="save-modal-cancel">关闭</button>
			</div>
		</div>
		<!-- 删除确认弹窗 -->
		<div id="confirm-modal">
			<div id="confirm-modal-box">
				<div id="confirm-title">删除存档</div>
				<div id="confirm-text">确定要删除该存档吗？此操作不可恢复。</div>
				<div id="confirm-actions">
					<button id="confirm-cancel">取消</button>
					<button id="confirm-ok">确认删除</button>
				</div>
			</div>
		</div>
		<!-- 拷贝目标选择弹窗 -->
		<div id="copy-modal">
			<div id="copy-modal-box">
				<div id="copy-title">拷贝存档</div>
				<div id="copy-text">拷贝到目标存档：</div>
				<div id="copy-targets">
					<button class="copy-tgt" data-dst="1">存档 1</button>
					<button class="copy-tgt" data-dst="2">存档 2</button>
					<button class="copy-tgt" data-dst="3">存档 3</button>
					<button class="copy-tgt" data-dst="4">存档 4</button>
					<button class="copy-tgt copy-tgt-backup" data-dst="5">备用 1</button>
					<button class="copy-tgt copy-tgt-backup" data-dst="6">备用 2</button>
				</div>
				<button id="copy-cancel">取消</button>
			</div>
		</div>
		<!-- 操作结果提示 -->
		<div id="save-toast"></div>
		<!-- UNITY -->
		<div id="unity-mobile-warning">WebGL not supported on mobile</div>
		<script defer src="./script/script.js"></script>
		<!-- 谷歌广告 -->
		<script async
			src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3670070169085381"
			crossorigin="anonymous"></script>
	</body>
</html>
